version: 1

formatters:
  detail:
    class: privacyidea.lib.log.SecureFormatter
    format: '[%(asctime)s][%(process)d][%(thread)d][%(levelname)s][%(name)s:%(lineno)d] %(message)s'

  audit:
    format: '%(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detail

  file:
    class: logging.handlers.TimedRotatingFileHandler
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8
    level: INFO
    formatter: detail
    filename: /var/log/privacyidea/privacyidea.log

# Audit log handler
  audit:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: audit
    filename: /var/log/privacyidea/audit.log
    maxBytes: 10000000
    backupCount: 14
    encoding: utf8

loggers:
  privacyidea:
    level: INFO
    handlers: [console, file]
    propagate: false

  privacyidea.lib.audit:
    level: INFO
    handlers: [audit]
    propagate: false

  privacyidea.audit:
    level: INFO
    handlers: [audit]
    propagate: false

root:
  level: INFO
  handlers: [console]
